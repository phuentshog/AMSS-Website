<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Google Drive Staff Photo Test</title>
  <style>
    body { max-width: 900px; margin: 40px auto; padding: 0 20px; color: #14233f; font: 16px/1.5 system-ui, sans-serif; }
    h1 { font-size: 1.6rem; }
    .photos { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
    article { padding: 16px; border: 1px solid #e5e7eb; border-radius: 8px; }
    img { display: block; width: 100%; height: 250px; object-fit: contain; background: #faf6e8; }
    .status { font-weight: 600; }
  </style>
</head>
<body>
  <h1>Google Drive photo link test</h1>
  <p>This page tests the workbook URLs as direct image sources. It does not change Drive sharing settings.</p>
  <main class="photos">
    <article>
      <h2>Karma Wangchuk</h2>
      <img src="https://drive.google.com/file/d/1KOUgaqPkBqyETltLGWAhrDtotTJl5jYc/view?usp=sharing" alt="Photo linked for Karma Wangchuk" loading="eager">
      <p class="status" aria-live="polite">Checking image…</p>
    </article>
    <article>
      <h2>Sangay Dorji</h2>
      <img src="https://drive.google.com/open?id=1SCodUUX5dkInhABvpYUJebg6mI5jgrOE" alt="Photo linked for Sangay Dorji" loading="eager">
      <p class="status" aria-live="polite">Checking image…</p>
    </article>
    <article>
      <h2>Sarita Devi Mongar</h2>
      <img src="https://drive.google.com/open?id=1KNZH4hmWsngis29E2qX7HUEXuA7oBaPz" alt="Photo linked for Sarita Devi Mongar" loading="eager">
      <p class="status" aria-live="polite">Checking image…</p>
    </article>
  </main>
  <script>
    document.querySelectorAll("article").forEach((card) => {
      const image = card.querySelector("img");
      const status = card.querySelector(".status");
      image.addEventListener("load", () => {
        status.textContent = "Loaded successfully";
        status.dataset.result = "loaded";
      });
      image.addEventListener("error", () => {
        status.textContent = "Could not load as an image";
        status.dataset.result = "failed";
      });
      if (image.complete) {
        image.dispatchEvent(new Event(image.naturalWidth > 0 ? "load" : "error"));
      }
    });
  </script>
</body>
</html>
